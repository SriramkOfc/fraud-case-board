[project]
name = "backend"
version = "0.1.0"
description = "Fraud case board backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.1",
    "openai>=3.52.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
